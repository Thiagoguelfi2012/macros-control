<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diário — Controle de Macros</title>
  <link rel="stylesheet" href="vendor/tom-select.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> Controle de Macros</div>
    <nav>
      <a href="index.html" class="active">Diário</a>
      <a href="relatorios.html">Relatórios</a>
    </nav>
  </header>

  <main>
    <div id="historico" aria-live="polite">
      <p class="loading">Carregando banco de alimentos…</p>
    </div>
  </main>

  <button class="btn btn-primary add-fab" id="btn-adicionar">+ Adicionar alimento</button>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo">Adicionar alimento</h2>

      <div class="field">
        <label for="sel-alimento">Alimento</label>
        <select id="sel-alimento" placeholder="Digite para pesquisar… ex.: arroz, frango, banana"></select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="inp-qtd">Quantidade</label>
          <input type="number" id="inp-qtd" min="0" step="any" value="100" />
        </div>
        <div class="field">
          <label for="sel-medida">Medida</label>
          <select id="sel-medida">
            <option value="g">gramas (g)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="inp-datahora">Data e hora</label>
        <input type="datetime-local" id="inp-datahora" />
      </div>

      <div class="preview" id="preview" hidden>
        <span>≈ <b id="pv-gramas">0</b> g</span>
        <span><b id="pv-kcal">0</b> kcal</span>
        <span class="macro-chip"><span class="sw sw-p"></span>Prot <b id="pv-p">0</b> g</span>
        <span class="macro-chip"><span class="sw sw-c"></span>Carb <b id="pv-c">0</b> g</span>
        <span class="macro-chip"><span class="sw sw-g"></span>Gord <b id="pv-g">0</b> g</span>
      </div>

      <div class="modal-actions">
        <button class="btn" id="btn-cancelar">Cancelar</button>
        <button class="btn btn-primary" id="btn-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <script src="vendor/tom-select.complete.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/busca.js"></script>
  <script src="js/diario.js"></script>
</body>
</html>
